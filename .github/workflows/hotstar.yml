name: Java CI/CD Pipeline to Tomcat

on:
  push:
    branches:
      - main

jobs:

  # ==========================================================
  # BUILD + SONARQUBE ANALYSIS
  # ==========================================================
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 3. Build application using Maven
      - name: Build with Maven
        run: |
          mvn clean package -DskipTests

      # 4. Verify WAR file
      - name: Verify WAR file
        run: |
          echo "Generated files:"
          ls -lh target/

          echo "WAR files:"
          find target -maxdepth 1 -name "*.war" -type f

      # ======================================================
      # SONARQUBE ANALYSIS
      # ======================================================

      # 5. Run SonarQube analysis
      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=hotstar-app \
            -Dsonar.projectName="Hotstar Java Application" \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      # 6. Upload WAR artifact
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp
          path: target/*.war
          if-no-files-found: error


  # ==========================================================
  # DEPLOY TO TOMCAT
  # ==========================================================
  deploy:
    runs-on: ubuntu-latest

    needs: build

    environment: production

    steps:

      # 7. Download WAR artifact
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp
          path: .

      # 8. Verify downloaded WAR
      - name: Verify downloaded WAR
        run: |
          echo "Downloaded files:"
          ls -lh

          echo "WAR file:"
          find . -maxdepth 1 -name "*.war" -type f

      # ======================================================
      # TOMCAT CONNECTIVITY TEST
      # ======================================================

      # 9. Check Tomcat connectivity
      - name: Check Tomcat connectivity
        run: |
          echo "Checking Tomcat server..."

          curl -v \
            --connect-timeout 10 \
            --max-time 30 \
            "http://${{ secrets.TOMCAT_HOST }}/"

      # ======================================================
      # TOMCAT DEPLOYMENT
      # ======================================================

      # 10. Deploy WAR to Tomcat Manager
      - name: Deploy to Tomcat
        run: |

          WAR_FILE=$(find . -maxdepth 1 -name "*.war" -type f | head -n 1)

          echo "WAR file found:"
          echo "$WAR_FILE"

          echo "Deploying application to Tomcat..."

          curl -v \
            --fail \
            --show-error \
            --connect-timeout 10 \
            --max-time 120 \
            -u "${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}" \
            --upload-file "$WAR_FILE" \
            "http://${{ secrets.TOMCAT_HOST }}/manager/text/deploy?path=/myapp&update=true"

          echo "Tomcat deployment completed successfully!"

      # ======================================================
      # DEPLOYMENT VERIFICATION
      # ======================================================

      # 11. Verify application deployment
      - name: Verify application
        run: |

          echo "Waiting for application to start..."
          sleep 10

          echo "Checking deployed application..."

          curl -v \
            --fail \
            --connect-timeout 10 \
            --max-time 30 \
            "http://${{ secrets.TOMCAT_HOST }}/myapp/"

          echo "Application is running successfully!"
