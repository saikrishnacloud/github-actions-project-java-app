name: Java CI/CD Pipeline to Tomcat  
 
on:
  push:
    branches: 
      - main

jobs:

  # ==========================================================
  # BUILD + SONARQUBE ANALYSIS
  # ==========================================================
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 3. Build application using Maven
      - name: Build with Maven
        run: |
          mvn clean package -DskipTests

      # 4. Verify WAR file
      - name: Verify WAR file
        run: |
          echo "Generated files:"
          ls -lh target/

          echo "WAR files:"
          find target -maxdepth 1 -name "*.war" -type f

      # 5. Install required tools
      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget

      # 6. Install SonarQube Scanner CLI
      - name: Install SonarQube Scanner CLI
        run: |
          if [ ! -d "$HOME/sonar-scanner-cli" ]; then
            echo "Downloading SonarQube Scanner CLI..."

            wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-7.3.0.5189-linux-x64.zip \
              -O /tmp/sonar-scanner.zip

            unzip /tmp/sonar-scanner.zip -d "$HOME"

            mv "$HOME/sonar-scanner-7.3.0.5189-linux-x64" \
               "$HOME/sonar-scanner-cli"
          fi

          echo "$HOME/sonar-scanner-cli/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/sonar-scanner-cli/bin:$PATH"

          sonar-scanner -v

      # 7. Run SonarQube Analysis
      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |

          echo "Checking SonarQube configuration..."

          if [ -z "$SONAR_HOST_URL" ]; then
            echo "ERROR: SONAR_HOST_URL secret is not configured."
            exit 1
          fi

          # Add http:// automatically if no scheme is provided
          if [[ "$SONAR_HOST_URL" != http://* && "$SONAR_HOST_URL" != https://* ]]; then
            SONAR_HOST_URL="http://$SONAR_HOST_URL"
          fi

          echo "SonarQube URL: $SONAR_HOST_URL"

          echo "Checking SonarQube server..."

          curl \
            --fail \
            --connect-timeout 10 \
            --max-time 30 \
            "$SONAR_HOST_URL/api/system/status"

          echo "SonarQube server is reachable."

          echo "Running SonarQube analysis..."

          sonar-scanner \
            -Dsonar.projectKey=hotstar-app \
            -Dsonar.projectName="Hotstar Java Application" \
            -Dsonar.sources=. \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"

          echo "SonarQube analysis completed successfully!"

      # 8. Upload WAR artifact
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp
          path: target/*.war
          if-no-files-found: error


  # ==========================================================
  # DEPLOY TO TOMCAT
  # ==========================================================
  deploy:
    runs-on: ubuntu-latest

    needs: build

    environment: production

    steps:

      # 9. Download WAR artifact
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp
          path: .

      # 10. Verify downloaded WAR
      - name: Verify downloaded WAR
        run: |
          echo "Downloaded files:"
          ls -lh

          echo "WAR file:"
          find . -maxdepth 1 -name "*.war" -type f

      # 11. Check Tomcat connectivity
      - name: Check Tomcat connectivity
        run: |
          echo "Checking Tomcat server..."
          echo "Tomcat Host: ${{ secrets.TOMCAT_HOST }}"

          curl -v \
            --connect-timeout 10 \
            --max-time 30 \
            "http://${{ secrets.TOMCAT_HOST }}/"

      # 12. Deploy WAR to Tomcat Manager
      - name: Deploy to Tomcat
        run: |

          WAR_FILE=$(find . -maxdepth 1 -name "*.war" -type f | head -n 1)

          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: WAR file not found!"
            exit 1
          fi

          echo "WAR file found:"
          echo "$WAR_FILE"

          echo "Deploying application to Tomcat..."

          curl -v \
            --fail \
            --show-error \
            --connect-timeout 10 \
            --max-time 120 \
            -u "${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}" \
            --upload-file "$WAR_FILE" \
            "http://${{ secrets.TOMCAT_HOST }}/manager/text/deploy?path=/myapp&update=true"

          echo "Tomcat deployment completed successfully!"

      # 13. Verify application
      - name: Verify application
        run: |

          echo "Waiting for application to start..."
          sleep 10

          echo "Checking deployed application..."

          curl -v \
            --fail \
            --connect-timeout 10 \
            --max-time 30 \
            "http://${{ secrets.TOMCAT_HOST }}/myapp/"

          echo "========================================="
          echo "APPLICATION DEPLOYED SUCCESSFULLY!"
          echo "========================================="
